site_name: maplibre-gl-three
site_description: Brings Three.js capabilities into MapLibre GL JS
site_url: !ENV READTHEDOCS_CANONICAL_URL
repo_url: https://github.com/safwat-halaby/maplibre-gl-three
docs_dir: docs
site_dir: site
exclude_docs: |
  /requirements.*

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: readthedocs

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Home: index.md
  - API Reference: api/index.md
  - Development: development.md
  - Changelog: changelog.md
  - Guides:
      - Coordinate systems and projections: coordinate-systems.md
