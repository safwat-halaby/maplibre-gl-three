version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
    nodejs: "22"
  jobs:
    post_install:
      - npm ci --include=dev
    pre_build:
      - npm run docs:api

python:
  install:
    - requirements: docs/requirements.txt

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true
